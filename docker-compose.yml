services:
  web:
    build: .
    container_name: zuorakiosk_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Store SQLite inside the mounted volume so data survives container rebuilds
      - SQLITE_PATH=/app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
  media_data: